---
name: quality-gates
# Ported from the LMMS standards fork (2026-09-09).
#
# Trigger policy (2026-09-11): the static gates run on every push and pull request;
# the build-backed jobs stay workflow_dispatch-only - unit-tests and coverage, plus the
# two suite jobs added 2026-09-12 (mcp-bridge-e2e-tests, vst3-instrument-fixture).
# Jobs that need no build run on push and pull request: static-gates and
# mcp-bridge-python-tests (the MCP bridge's Python suites; see that job's comment).
#
# "Dispatch only - Actions minutes are metered" did not survive the cost check:
# build.yml already runs a 7-job matrix on every push (~29-47 min per job,
# ~206 job-minutes total - run 34600092687), while this workflow's static-gates job
# needs no build and cost 0.2-0.4 min of runner time when it ran (runs 34420873063,
# 34413527781). Enforcing it adds ~0.1-0.2% to the minutes the repo already spends
# per push.
#
# Kept dispatch-only, with `if: github.event_name == 'workflow_dispatch'`:
#   - unit-tests (gates 1+5): full Debug+Qt6 build, ctest, ~3 min mutation sweep
#     (14-24.5 min measured in CI); build.yml already builds and ctest-runs this
#     tree on every push.
#   - coverage (gate 2): instrumented build + lcov (15-22.4 min measured in CI),
#     and capture_baseline=true WRITES tests/coverage-baseline.tsv - a baseline
#     refresh must stay a deliberate act, never a side effect of a push.
'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capture_baseline:
        description: "Gate 2 write mode: recapture coverage-baseline.tsv on the runner and upload it"
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Gates 3, 4, 6, 7, 8, 9 and 11 need no build: they read the sources, the git history
  # and the tracked file set. This is the job enforced on push and pull_request (see the
  # trigger policy above).
  #
  # Gate 11 (REPO-2, 2026-09-13). The step is what makes the evidence deletion stick:
  # 140.4 MiB of run logs, coverage captures and renders sat in tests/ through every
  # green run of this job, because a gate suite that measures code cannot see a
  # directory of *.log. The job name gains "11" in the same change, so the label and the
  # work agree; nothing is bound to the old string yet - the repo has no
  # required_status_checks rule (measured 2026-09-13: the three rulesets are
  # main-protection, main-requires-pull-request and release-tag-protection, none of them
  # a required check), and REL-1 is the item that will require these names.
  static-gates:
    name: static gates (3, 4, 6, 7, 8, 9, 11, 12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history - Gate 6 needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lizard
        run: pip install lizard
      - name: Gate 3 - no tautological tests
        run: bash tests/no-tautology-gate.sh
      - name: Gate 4 - per-method complexity (CC <= 10 ratchet)
        run: bash tests/complexity-gate.sh --check
      # The fork's own tooling under tools/ is measured by its own scope and baselines
      # (tests/tools-sources.txt, tests/*-baseline-tools.tsv) - see tests/QA-GATES.md.
      - name: Gate 4 - per-method complexity, tools scope (fork tooling)
        run: bash tests/complexity-gate.sh --check --scope tools
      - name: Gate 6 - no upstream behavioural regressions
        run: bash tests/no-upstream-regression-gate.sh
      - name: Gate 7 - per-file length ratchet
        run: bash tests/file-length-gate.sh --check
      - name: Gate 7 - per-file length, tools scope (fork tooling)
        run: bash tests/file-length-gate.sh --check --scope tools
      - name: Gate 8 - token duplication
        run: bash tests/duplication-gate.sh
      - name: Gate 8 - token duplication, tools scope (fork tooling)
        run: bash tests/duplication-gate.sh --scope tools
      - name: Gate 9 - every tracked source is registered in a scope manifest
        run: bash tests/fork-sources-gate.sh
      - name: Gate 11 - no committed evidence and nothing over the size cap
        run: bash tests/evidence-gate.sh
      # The row runs the gate's own red/green control too: it asserts the gate refuses
      # a .log, an over-cap file, an archive and a compiled artefact BY NAME, and a
      # tracked over-cap file through the git index (this job's own path). run-all-gates.sh
      # runs both in one row for the same reason.
      - name: Gate 11 control - the evidence gate's own red/green self-test
        run: bash tests/evidence-gate.sh --self-test
      # Gate 12 (board card #678 / feature row 52, added 2026-09-16): the sweeping
      # enforcement of AGENTS.md's realtime rule - no allocation, no locking, no
      # unbounded growth on audio-thread paths. It reads the sources named in
      # tests/rt-safety-scope.txt and judges the hits against
      # tests/rt-safety-allowlist.txt, so it needs no build and belongs in this job.
      # Its controls are the ctest RtSafetySelfTest.
      - name: Gate 12 - real-time safety (whole-tree sweep)
        run: python3 tests/rt-safety-sweep.py --check

  # Gate 1 needs a real build: "it compiles" never substitutes for a passing ctest.
  unit-tests:
    name: gate 1 - unit tests
    # Dispatch-only: full Debug+Qt6 build + ctest + the ~3 min mutation sweep.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies (Qt6, mirrors the locally verified build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            qt6-base-dev libqt6svg6-dev qt6-l10n-tools \
            libsndfile1-dev libfftw3-dev libasound2-dev libjack-jackd2-dev \
            libsamplerate0-dev libxml2-dev \
            liblist-moreutils-perl libxml-parser-perl
      - name: Configure (Debug, Qt6)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DWANT_QT6=ON
      - name: Build
        run: cmake --build build -j4
      - name: Gate 1 - ctest (must run from build/tests)
        run: cd build/tests && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
      # Gate 5 reuses the build above; the sweep is ~3 min (30 mutants, one TU).
      - name: Gate 5 - mutation testing (scoped harness, src/core/RoutingGraph.cpp)
        run: bash tests/mutation-gate.sh

  # Gate 2 is the ratchet: the number must not fall, and the gate must PASS.
  coverage:
    name: gate 2 - coverage ratchet
    # Dispatch-only: instrumented build + lcov, and capture_baseline WRITES the baseline.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ lcov \
            qt6-base-dev libqt6svg6-dev qt6-l10n-tools \
            libsndfile1-dev libfftw3-dev libasound2-dev libjack-jackd2-dev \
            libsamplerate0-dev libxml2-dev \
            liblist-moreutils-perl libxml-parser-perl
      # Default mode is the ratchet: the number must not fall. The baseline is
      # committed, so it must have been captured in the SAME environment the gate
      # runs in; run this workflow with capture_baseline=true to refresh it here.
      - name: Gate 2 - coverage ratchet, CI mode (baseline never written)
        if: ${{ !inputs.capture_baseline }}
        run: |
          bash tests/run-coverage.sh build-coverage -DWANT_QT6=ON
          bash tests/coverage-gate.sh build-coverage/coverage/coverage-fork.info --check
      - name: Gate 2 - capture the baseline on the runner (write mode)
        if: ${{ inputs.capture_baseline }}
        run: |
          bash tests/run-coverage.sh build-coverage -DWANT_QT6=ON
          # Drop the committed baseline first: with no baseline every file counts
          # as an addition, so write mode records this run's numbers instead of
          # refusing to write because the old baseline looks "regressed".
          rm -f tests/coverage-baseline.tsv
          bash tests/coverage-gate.sh build-coverage/coverage/coverage-fork.info
          echo "--- captured baseline ---"
          cat tests/coverage-baseline.tsv
      - name: Upload the CI-captured baseline
        if: ${{ always() && inputs.capture_baseline }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-ci
          path: tests/coverage-baseline.tsv
          if-no-files-found: warn
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build-coverage/coverage/html
          if-no-files-found: warn

  # The MCP bridge's Python suites (tools/mcp-zene-control/tests) - the ones the
  # programme's handoff lists as "run by nothing in the pipeline". NEEDS NO BUILD:
  # this is Python only (no cmake, no Qt, no compiler), so like static-gates it runs
  # on every push and pull request.
  #
  # Scope, stated honestly: 53 of the bridge's 64 tests run here. test_units (39:
  # naming, generation, configuration, taxonomy, offline surfaces) and test_wire_client
  # (14: real AF_UNIX sockets against harness.StubDaw, no DAW). The other 11 -
  # test_mcp_e2e (6) and test_mcp_errors (5) - start a real headless Zene Studio
  # binary, so they need a build: mcp-bridge-e2e-tests below, dispatch-only.
  mcp-bridge-python-tests:
    name: MCP bridge Python tests (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the MCP SDK the bridge imports
        # tools/mcp-zene-control ships no requirements file; 2.0.0 is the version the
        # suites were verified against (README, "Runtime").
        run: pip install "mcp==2.0.0"
      - name: Run the two suites that need no DAW binary
        # 0 tests is an error, never a pass: each module's "Ran N tests" is read back
        # and a zero fails the job (a crashed import still exits non-zero, but the
        # count check is what catches a suite that silently collected nothing).
        run: |
          cd tools/mcp-zene-control || exit 1
          status=0
          total=0
          for module in test_units test_wire_client; do
            log="/tmp/mcp-bridge-${module}.log"
            code=0
            python3 -m unittest "tests.${module}" > "$log" 2>&1 || code=$?
            ran=$(sed -n 's/^Ran \([0-9][0-9]*\) tests\?.*/\1/p' "$log" | tail -1)
            echo "::group::python3 -m unittest tests.${module}"
            cat "$log"
            echo "::endgroup::"
            echo "tests.${module}: ran ${ran:-0} test(s), exit ${code}"
            if [ "${ran:-0}" -eq 0 ]; then
              echo "::error::tests.${module} ran 0 tests - 0 tests is an error, not a pass"
              status=1
            fi
            [ "$code" -eq 0 ] || status=1
            total=$((total + ${ran:-0}))
          done
          echo "MCP bridge Python tests (no build): ${total} test(s) run"
          if [ "$total" -eq 0 ]; then
            echo "::error::no tests ran at all"
            status=1
          fi
          exit "$status"

  # The bridge's end-to-end suites: the 11 tests the no-build job above cannot reach.
  # test_mcp_e2e and test_mcp_errors start the built `zene` binary with --control-socket
  # through tests/harness.py (Dummy audio, offscreen Qt) and drive it over a real
  # AF_UNIX socket, so this job needs a build - and is therefore dispatch-only, like
  # unit-tests and coverage.
  #
  # UNVERIFIED FROM THE AUTHORING BOX: nothing may be pushed from there, so this job
  # has never been triggered and no build was run to prove it. Dispatch it once and
  # read the log before trusting it. Expected risk in that log: the bridge README
  # records test_mcp_e2e's test_11 (control.undo) failing against a merged-tree build
  # because the DAW SEGFAULTs inside ProjectJournal::undo - a DAW-side defect the
  # bridge reports honestly as the typed `disconnected`.
  mcp-bridge-e2e-tests:
    name: MCP bridge end-to-end tests (needs a build)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies (Qt6, mirrors the locally verified build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            qt6-base-dev libqt6svg6-dev qt6-l10n-tools \
            libsndfile1-dev libfftw3-dev libasound2-dev libjack-jackd2-dev \
            libsamplerate0-dev libxml2-dev \
            liblist-moreutils-perl libxml-parser-perl
      - name: Install the MCP SDK the bridge imports
        run: pip install "mcp==2.0.0"
      - name: Configure (Debug, Qt6)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DWANT_QT6=ON
      - name: Build
        run: cmake --build build -j4
      - name: Run all four bridge suites against the built binary
        # tests/harness.py's default binary is <repo>/tools/zene-pa-agentctl/build/lmms,
        # a lane path that does not exist in this tree, so the binary is passed
        # explicitly - located, not assumed.
        run: |
          cd tools/mcp-zene-control || exit 1
          bin=$(find "$GITHUB_WORKSPACE/build" -maxdepth 3 -type f -name zene -perm -u+x | head -1)
          if [ -z "$bin" ]; then
            echo "::error::no built 'zene' binary under build/ - the end-to-end suites need one"
            exit 1
          fi
          echo "ZENE_CONTROL_BINARY=$bin"
          export ZENE_CONTROL_BINARY="$bin"
          py=$(command -v python3)
          export ZENE_CONTROL_PYTHON="$py"
          status=0
          pairs=("tests.test_units tests.test_wire_client" "tests.test_mcp_e2e tests.test_mcp_errors")
          for pair in "${pairs[@]}"; do
            read -r -a modules <<< "$pair"
            log="/tmp/mcp-bridge-$(echo "$pair" | tr ' .' '__').log"
            code=0
            python3 -m unittest "${modules[@]}" > "$log" 2>&1 || code=$?
            ran=$(sed -n 's/^Ran \([0-9][0-9]*\) tests\?.*/\1/p' "$log" | tail -1)
            echo "::group::python3 -m unittest $pair"
            cat "$log"
            echo "::endgroup::"
            echo "$pair: ran ${ran:-0} test(s), exit ${code}"
            if [ "${ran:-0}" -eq 0 ]; then
              echo "::error::$pair ran 0 tests - 0 tests is an error, not a pass"
              status=1
            fi
            [ "$code" -eq 0 ] || status=1
          done
          exit "$status"

  # The CMake fixture-gated VST3 instrument suites. tests/CMakeLists.txt gates three
  # ctest targets behind `if(TARGET lmms_vst3_sdk)` + WANT_VST3_TEST_INSTRUMENT
  # (default OFF; docs/VST3-INSTRUMENT-FIXTURE.md): Vst3InstrumentFixtureProbe,
  # Vst3InstrumentTest and Vst3InstrumentIntegrationTest. Nothing in CI has ever passed
  # that option - build.yml configures every release job without it (only -DWANT_VST3=ON)
  # - so these three execute nowhere automated today.
  #
  # They need the pinned VST3 SDK, which is what makes a job viable at all:
  # .github/workflows/provision-plugin-hosting-deps.sh fetches it at the pin (MIT,
  # verified from the SDK's own LICENSE.txt) into build/vst3sdk, exactly where
  # plugins/Vst3Effect/CMakeLists.txt's default LMMS_VST3_SDK_PATH looks - no extra -D.
  # The two cache keys are build.yml's, so a pin bump invalidates them.
  #
  # A build is required (the probe links lmms_vst3_sdk, the integration test links
  # lmmsobjs), so like unit-tests and coverage this job is dispatch-only. It is not
  # wired into the release matrix and build.yml is untouched.
  #
  # UNVERIFIED FROM THE AUTHORING BOX: nothing may be pushed from there and no build
  # was run (a sibling session holds the box's one build slot), so this job has never
  # been triggered. Dispatch it once and read the log before trusting it. The
  # configuration is the one docs/VST3-INSTRUMENT-FIXTURE.md records passing locally
  # (section 6.1: ctest 26/26, the probe as test 26), and the -DUSE_WERROR=ON failure that
  # doc records is fixed in this tree (cmake/modules/Vst3Sdk.cmake marks
  # lmms_vst3_sdk SYSTEM).
  vst3-instrument-fixture:
    name: VST3 instrument fixture suites (needs a build + the pinned SDK)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache the pinned VST3 SDK
        uses: actions/cache@v4
        with:
          path: build/vst3sdk
          key: "vst3sdk-${{ runner.os }}-${{ hashFiles('cmake/modules/Vst3Sdk.cmake') }}"
      - name: Cache the pinned CLAP headers
        uses: actions/cache@v4
        with:
          path: build/clap
          key: "clap-${{ runner.os }}-${{ hashFiles('cmake/modules/ClapHeaders.cmake') }}"
      - name: Provision the pinned VST3 SDK and CLAP headers
        # The same step build.yml runs before Configure on every release job.
        run: bash .github/workflows/provision-plugin-hosting-deps.sh build
      - name: Install build dependencies (Qt6, mirrors the locally verified build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            qt6-base-dev libqt6svg6-dev qt6-l10n-tools \
            libsndfile1-dev libfftw3-dev libasound2-dev libjack-jackd2-dev \
            libsamplerate0-dev libxml2-dev \
            liblist-moreutils-perl libxml-parser-perl
      - name: Configure (Debug, Qt6, fixture ON)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWANT_QT6=ON \
            -DWANT_VST3=ON \
            -DWANT_VST3_TEST_INSTRUMENT=ON
      - name: Build the three fixture targets
        # Named explicitly, not "build everything": with no SDK the option is never
        # declared (it sits inside if(TARGET lmms_vst3_sdk)), so these targets do not
        # exist and this step fails loudly instead of quietly running nothing.
        run: |
          cmake --build build -j4 --target \
            Vst3InstrumentFixtureProbe \
            Vst3InstrumentTest \
            Vst3InstrumentIntegrationTest
      - name: Run the three fixture suites (ctest must run from build/tests)
        run: |
          set -o pipefail
          cd build/tests || exit 1
          ctest -R '^Vst3Instrument' --output-on-failure --no-tests=error | tee /tmp/vst3-fixture-ctest.log
          # 0 tests must never read as green: assert all three suites ran.
          grep -q 'out of 3' /tmp/vst3-fixture-ctest.log
