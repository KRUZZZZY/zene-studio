        # prints "VST3 hosting skipped" and "CLAP hosting skipped" and the release
        # ships neither host. The pins are read out of
        # cmake/modules/{Vst3Sdk,ClapHeaders}.cmake by the script (which carries
        # no copy), and the two cache keys above hash those same files, so bumping
        # a pin in a module invalidates the cache by itself. A full run clones
        # ~39 MB of SDK sources + ~7 MB of CLAP headers once per operating system;
        # later runs restore both from the cache and clone nothing.
        run: bash .github/workflows/provision-plugin-hosting-deps.sh build
      - name: Configure
        run: |
          ccache --zero-stats
          mkdir build -Force
          cmake -S . `
            -B build `
            -G Ninja `
            --toolchain C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -Werror=dev `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DTARGET_UARCH=official `
            -DWANT_QT6=ON `
            -DUSE_COMPILE_CACHE=ON `
            -DUSE_WERROR=ON `
            -DWANT_VST3=ON `
            -DWANT_CLAP=ON `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DVCPKG_HOST_TRIPLET="x64-windows" `
            -DVCPKG_MANIFEST_INSTALL="${{ env.should_install_manifest }}"
        env:
          should_install_manifest:
            ${{ steps.cache-deps.outputs.cache-hit == 'true' && 'NO' || 'YES' }}
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure -j2 || {
            echo "=== ctest failed: re-running only the failed tests, verbosely ==="
            ctest --rerun-failed -V
            exit 1
          }
        env:
          # QtTest on Windows writes to the debug log instead of the pipe when stderr has no
          # console attached (qplaintestlogger.cpp: stream == stdout && !shouldLogToStderr()
          # -> OutputDebugStringA), so ctest captured an EMPTY Output section for every one of
          # the 24 tests - passing and failing alike. Verified by fetching this job's own
          # artifact from run 34607374243. Without this line no assertion text can ever be read
          # from a Windows run, which makes any fix unfalsifiable.
          QT_FORCE_STDERR_LOGGING: "1"
      - name: Prove the plugin modules' zene.exe import binding (diagnostic, non-fatal)
        # if: always() matters: without it this step is SKIPPED whenever Run tests fails, which
        # is exactly the case it exists to explain - the first run carrying it produced no
        # dumpbin output at all for that reason (the QWARN lines still proved the mechanism).
        if: always()
        # The three failing tests are exactly the three that load plugin MODULE libraries at
        # runtime. Those modules link the zene executable, so on Windows their import tables
        # name zene.exe; a test host cannot satisfy that. This turns the inference into evidence
        # (an import descriptor reading zene.exe, and the exe really exporting the core symbols)
        # and is deliberately non-fatal: it is proof, not a gate.
        continue-on-error: true
        shell: cmd
        run: |
          echo === synthetic_audio_plugin.dll: import tables ===
          dumpbin /dependents build\tests\synthetic_audio_plugin.dll
          dumpbin /imports build\tests\synthetic_audio_plugin.dll | findstr /i "zene.exe"
          echo === migrated plugin module (same question) ===
          dumpbin /imports build\plugins\amplifier.dll | findstr /i "zene.exe"
          echo === does the executable export the core symbols? ===
          dumpbin /exports build\zene.exe | findstr /i "AudioPortsModel"
      - name: Upload the ctest log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-msvc-x64
          path: build/tests/Testing/Temporary/LastTest.log
          # Deliberately exempt from the package guard: this is evidence, not a package.
          # The step runs on failure() and ctest may not have written the log, so a
          # missing file must not fail the job (that would hide the real failure).
          if-no-files-found: warn
      - name: Crash evidence (a signal death must name its cause)
        # The C++ QtTest suites do not use the python harness, so an instance that dies of a signal
        # writes its crash report into the runner's XDG data dir rather than a test temp dir - and run
        # 34731085749 showed QtTest printing an EMPTY stack ("dumping stack" then "End of stack trace",
        # nothing between), which names the symptom and not the cause. This collects whatever the
        # product wrote, wherever it wrote it. Harmless when a job has no test step.
        if: failure()
        # Evidence only: it must never fail a job that the test step already failed.
        # (Cycle 8 showed it exiting 1 when no report existed, which is a normal outcome.)
        continue-on-error: true
        shell: bash
        run: |
          echo "=== zene crash reports (a signal death writes one) ==="
          find "$HOME" "${GITHUB_WORKSPACE:-.}" /tmp -maxdepth 6 \
            -name 'zene-crash-report*' 2>/dev/null | head -20 > /tmp/crash-list.txt
          while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done < /tmp/crash-list.txt
          echo "=== end of crash reports ==="
      - name: Release-honesty guard (a documented feature must be in this build)
        # Fails when a feature the release documents as present has been compiled
        # out. The list of documented features has ONE home --
        # tests/advertised-features.tsv -- which this gate reads; the build's own
        # report is the generated header its "Build options:" line is printed
        # from, and the plugin module the option implies is looked up in the build
        # tree. v0.1.0-alpha passed every other step with both hosts skipped.
        shell: bash
        env:
          # msvc-x64 runs on a Windows runner so uname already says windows; stated
          # explicitly so the three Windows-target jobs are read the same way by eye.
          RELEASE_HONESTY_PLATFORM: windows
        run: bash tests/release-honesty-gate.sh --header build/lmmsversion.h --artifacts build
      - name: Release version guard (the version, the documents and the tag must agree)
        # The honesty guard above reads build OPTIONS; it cannot see what the release is CALLED.
        # This one fails when the version this tree declares disagrees with the release notes and
        # the README that name it, or when a tag build's ref is not v<version> — the two ways a
        # release ships a version string no document (or no artefact) agrees with.
        shell: bash
        run: bash tests/release-version-gate.sh
      - name: Package
        run: cmake --build build --target package
      - name: NSIS compiler output (a packaging failure names its cause here)
        # CPack sends makensis' own stderr to NSISOutput.log and prints only that
        # file's path, so a packaging failure states no cause in this log: the
        # 0.2.1 matrix lost a cycle to an unquoted `InstallDir` whose one line
        # ("expects 1 parameters, got 2") existed nowhere else. Always print it.
        #
        # The 0.3.0 line found the same file from the other end, and its note is
        # kept here too: every Windows packaging failure in this matrix has been a
        # CPack/NSIS failure whose real error is written to
        # <build>/_CPack_Packages/<system>/NSIS/NSISOutput.log - a file no step
        # ever printed or uploaded, so the cause had to be inferred from
        # "CPack Error: Problem running NSIS command" alone (that is where the
        # windows-arm64 Package failure stands).
        if: failure()
        # Evidence only: the Package step above is the gate, this prints its
        # cause, so it must never fail a job the Package step did not. Both guards
        # are kept: continue-on-error makes the step tolerable whatever runs it,
        # and the trailing `exit 0` makes the script itself unable to fail.
        continue-on-error: true
        run: |
          for f in build/_CPack_Packages/*/NSIS/NSISOutput.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done
          exit 0
      - name: Upload artifacts
        # Only a TAG publishes a package. REL-2 (2026-09-15) removed the
        # `|| github.event_name == 'workflow_dispatch'` disjunct that used to be here:
        # a dispatch on any branch staged release packages with no fitness verdict
        # anywhere in the run, so dispatch was a second sanctioned staging path beside
        # the release job. Staging is tag-only now, and a tag is only cut from a ref that
        # .github/workflows/release.yml's fitness job has judged FIT. The shape is
        # asserted on every push by tests/release-staging-path-gate.sh (leg
        # `staging-path` of tests/release-ref-fitness.sh), so it cannot come back
        # silently. Per-push uploads of ~700 MB are still excluded for the original
        # reason: they exhausted the artifact storage quota.
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 14
          path: build\zene-*.exe
          # A missing package must fail this job, not warn (see the linux-x86_64 step).
          if-no-files-found: error
      - name: Trim ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats --verbose
        env:
          CCACHE_MAXSIZE: 500MB
