        run: |
          cd build/tests
          ctest --output-on-failure -j3 || {
            echo "=== ctest failed: re-running only the failed tests, verbosely ==="
            ctest --rerun-failed -V
            exit 1
          }
      - name: Signal-death backtrace (a SIGSEGV must name its frame)
        # QtTest's own handler prints an EMPTY stack on a runner - "Received signal at function
        # time: 0ms ... dumping stack" then "End of stack trace" with nothing between - so the
        # crashing frame is only obtainable by running the binary under a debugger. Bounded: at
        # most three tests, 120 s each; best-effort: it can never fail the job it explains.
        # The bound is `timeout` (GNU coreutils), and the macOS runners do not have it: this step
        # has never produced a backtrace there - run 35126160372, job 104895806458 ends its
        # debugger loop with "line 19: timeout: command not found", which is why that run's two
        # macOS failures (SafeStartTest, Vst3ChunkProbeTest) carry no frame. `gtimeout` is the
        # Homebrew coreutils spelling; with neither, the debugger runs unbounded rather than the
        # evidence being skipped.
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          cd build/tests || exit 0
          log=Testing/Temporary/LastTestsFailed.log
          if command -v gdb >/dev/null 2>&1; then dbg=gdb; else dbg=lldb; fi
          command -v "$dbg" >/dev/null 2>&1 || { echo "no gdb or lldb here: no backtrace"; exit 0; }
          if command -v timeout >/dev/null 2>&1; then tmo=(timeout 120)
          elif command -v gtimeout >/dev/null 2>&1; then tmo=(gtimeout 120)
          else tmo=(); echo "no timeout/gtimeout here: the debugger run below is unbounded"; fi
          [ -f "$log" ] || { echo "no $log: nothing to re-run"; exit 0; }
          # ctest writes "<test-number>:<test-name>", one line per failed test - NOT a reason,
          # so the crash/no-crash split cannot be read out of this file; the debugger reports
          # the signal itself. The python-driven Control* suite is skipped: its harness collects
          # its own liveness/CPU/backtrace evidence and already prints it.
          head -3 "$log" | while read -r entry; do
            name=${entry#*:}
            [ -x "./$name" ] || continue
            case "$name" in Control*) continue ;; esac
            echo "=== $dbg backtrace of failed test $name ==="
            if [ "$dbg" = gdb ]; then
              QT_QPA_PLATFORM=offscreen "${tmo[@]}" gdb -batch -q -ex "set pagination off" \
                -ex run -ex "thread apply all bt" --args "./$name" 2>&1 | tail -120 || true
            else
              QT_QPA_PLATFORM=offscreen "${tmo[@]}" lldb -b -o run \
                -o "thread backtrace all" -o quit -- "./$name" 2>&1 | tail -120 || true
            fi
          done
