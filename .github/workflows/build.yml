  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, arm64 ]
        include:
          - arch: x86_64
            os: macos-15-intel
            xcode: "16.4"
          - arch: arm64
            os: macos-15
            xcode: "16.4"
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_OPTS: >-
        -Werror=dev
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
        -DWANT_VST3=ON
        -DWANT_CLAP=ON
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
      MAKEFLAGS: -j3
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Clean up Homebrew download cache
        run: rm -rf ~/Library/Caches/Homebrew/downloads
      - name: Restore Homebrew download cache
        id: cache-homebrew
        uses: actions/cache/restore@v3
        with:
          key: n/a - only restore from restore-keys
          restore-keys: |
            homebrew-${{ matrix.arch }}-
          path: ~/Library/Caches/Homebrew/downloads
      - name: Cache ccache data
        uses: actions/cache@v3
        with:
          key: "ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.ref }}\
            -${{ github.run_id }}"
          restore-keys: |
            ccache-${{ github.job }}-${{ matrix.arch }}-${{ github.ref }}-
            ccache-${{ github.job }}-${{ matrix.arch }}-
          path: ~/Library/Caches/ccache
      - name: Install dependencies
        run: |
          brew bundle install --verbose
          pipx install dmgbuild
          pipx ensurepath
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      - name: Cache the pinned VST3 SDK
        uses: actions/cache@v4
        with:
          path: build/vst3sdk
          key: "vst3sdk-${{ runner.os }}-${{ hashFiles('cmake/modules/Vst3Sdk.cmake') }}"
      - name: Cache the pinned CLAP headers
        uses: actions/cache@v4
        with:
          path: build/clap
          key: "clap-${{ runner.os }}-${{ hashFiles('cmake/modules/ClapHeaders.cmake') }}"
      - name: Provision the pinned VST3 SDK and CLAP headers
        # Runs on every job that packages a release. Without it each configure
        # prints "VST3 hosting skipped" and "CLAP hosting skipped" and the release
        # ships neither host. The pins are read out of
        # cmake/modules/{Vst3Sdk,ClapHeaders}.cmake by the script (which carries
        # no copy), and the two cache keys above hash those same files, so bumping
        # a pin in a module invalidates the cache by itself. A full run clones
        # ~39 MB of SDK sources + ~7 MB of CLAP headers once per operating system;
        # later runs restore both from the cache and clone nothing.
        run: bash .github/workflows/provision-plugin-hosting-deps.sh build
      - name: Configure
        run: |
          ccache --zero-stats
          source .github/workflows/macos-env.sh
          mkdir -p build
          cmake -S . \
                -B build \
                -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
                $CMAKE_OPTS \
                -DUSE_WERROR=OFF
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure -j3 || {
            echo "=== ctest failed: re-running only the failed tests, verbosely ==="
            ctest --rerun-failed -V
            exit 1
          }
      - name: Release-honesty guard (a documented feature must be in this build)
        # Fails when a feature the release documents as present has been compiled
        # out. The list of documented features has ONE home --
        # tests/advertised-features.tsv -- which this gate reads; the build's own
        # report is the generated header its "Build options:" line is printed
        # from, and the plugin module the option implies is looked up in the build
        # tree. v0.1.0-alpha passed every other step with both hosts skipped.
        run: bash tests/release-honesty-gate.sh --header build/lmmsversion.h --artifacts build
      - name: Release version guard (the version, the documents and the tag must agree)
        # The honesty guard above reads build OPTIONS; it cannot see what the release is CALLED.
        # This one fails when the version this tree declares disagrees with the release notes and
        # the README that name it, or when a tag build's ref is not v<version> — the two ways a
        # release ships a version string no document (or no artefact) agrees with.
        run: bash tests/release-version-gate.sh
      - name: Package
        run: |
          cmake --build build --target package
      - name: Upload artifacts
        # Only a tag (the release path) or a deliberate dispatch publishes a package:
        # per-push uploads of ~700 MB exhausted the artifact storage quota.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 14
          path: build/zene-*.dmg
          # A missing package must fail this job, not warn (see the linux-x86_64 step).
          if-no-files-found: error
      - name: Trim ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats --verbose
        env:
          CCACHE_MAXSIZE: 500MB
      - name: Save Homebrew download cache
        if: ${{ steps.cache-homebrew.outputs.cache-matched-key != env.key }}
        uses: actions/cache/save@v3
        with:
          key: ${{ env.key }} 
          path: ~/Library/Caches/Homebrew/downloads
        env:
          key: "homebrew-${{ matrix.arch }}\
            -${{ hashFiles('Brewfile.lock.json') }}"
  mingw:
    name: mingw64
    runs-on: ubuntu-latest
    env:
      CMAKE_OPTS: >-
        -Werror=dev
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
        -DWANT_VST3=ON
        -DWANT_CLAP=OFF
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
      MAKEFLAGS: -j2
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Cache vcpkg dependencies
        id: cache-deps
        uses: actions/cache@v3
        with:
          key: vcpkg-mingw${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-mingw${{ matrix.arch }}-
          path: build/vcpkg_installed
      - name: Cache ccache data
        uses: actions/cache@v3
        with:
          key: "ccache-${{ github.job }}-64-${{ github.ref }}\
            -${{ github.run_id }}"
          restore-keys: |
            ccache-${{ github.job }}-64-${{ github.ref }}-
            ccache-${{ github.job }}-64-
          path: ~/.ccache
      - name: Install dependencies
        run: |
          sudo .github/workflows/setup-mingw-packages.sh
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-mingw.txt)
      - name: Cache the pinned VST3 SDK
        uses: actions/cache@v4
        with:
          path: build/vst3sdk
          key: "vst3sdk-${{ runner.os }}-${{ hashFiles('cmake/modules/Vst3Sdk.cmake') }}"
      - name: Cache the pinned CLAP headers
        uses: actions/cache@v4
        with:
          path: build/clap
          key: "clap-${{ runner.os }}-${{ hashFiles('cmake/modules/ClapHeaders.cmake') }}"
      - name: Provision the pinned VST3 SDK and CLAP headers
        # Runs on every job that packages a release. Without it each configure
        # prints "VST3 hosting skipped" and "CLAP hosting skipped" and the release
        # ships neither host. The pins are read out of
        # cmake/modules/{Vst3Sdk,ClapHeaders}.cmake by the script (which carries
