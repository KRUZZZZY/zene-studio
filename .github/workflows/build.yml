        # PYTHON3_EXECUTABLE, not whatever `python3` this step's PATH resolves. That is
        # the measured correction of the first version of this step, which assumed the
        # two were one interpreter: on macos-arm64 (run 35126160372, job 104895806458)
        # the ControlMasteringCommands ctest line names /usr/local/bin/python3 while this
        # step's `python3` was /opt/homebrew/opt/python@3.14/bin/python3.14 - the arm64
        # runner's PATH puts /opt/homebrew/bin first and CMake's own prefix search found
        # the /usr/local one, so the step's pip installed numpy 2.5.3 + scipy 1.18.1 into
        # HOMEBREW's PEP 668 python ("plain pip refused" -> "--break-system-packages" ->
        # "Successfully installed numpy-2.5.3 scipy-1.18.1") and ControlMasteringCommands
        # was red for the same missing module anyway. macos-x86_64 passed the same test:
        # there Homebrew IS /usr/local, so the interpreter the ctest line names and the
        # one this step installs into coincide. tools/auto-mastering-demo.py is loaded by
        # path in the test's OWN interpreter (tests/mastering_probe_lib.py
        # shipped_fixture(), importlib), so the packages have to be in that one.
        # The PEP 668 retry stays: an Intel runner's /usr/local python is a Homebrew one.
        # The last two lines print the interpreter and both versions, so a provisioning
        # that landed in a different python fails HERE instead of leaving
        # ControlMasteringCommands red for the same reason twice.
