---
name: build
# Packages are only uploaded for a tag or a deliberate dispatch (see the upload steps):
# every push used to publish ~700 MB, which exhausted the account's artifact storage and
# made the upload itself fail with a 403. The ctest log stays unconditional - it is tiny
# and it is how a Windows failure becomes readable.
'on':
  push:
  pull_request:
  workflow_dispatch:
# NOTE (2026-09-11): the deps-*.txt files under this directory are consumed with
# `xargs` in the install steps, so they must contain package names only. A comment
# line there is handed to apt as a package name and the step dies with
# 'E: Unable to locate package #' (cost one CI cycle). Put the rationale here, not
# in the list. The same applies to deps-ubuntu-24.04-fltk.txt.
#
# NOTE (plugin hosting, 2026-09-12): every job provisions the pinned VST3 SDK and
# CLAP headers before Configure and passes -DWANT_VST3=ON -DWANT_CLAP=ON, so a
# missing checkout is a configure FAILURE instead of the STATUS-line skip the
# published v0.1.0-alpha shipped to users on all seven jobs ("VST3 hosting
# skipped" / "CLAP hosting skipped") while its release notes advertised both
# hosts. The two cache steps hash the pin-bearing cmake modules, and the
# Release-honesty guard step fails the job if a documented feature is compiled out.
#
# CLAP ON WINDOWS (2026-09-13). Every platform job in this matrix now passes
# -DWANT_CLAP=ON (six job definitions, seven platforms — the macOS job is one
# definition over two arches). The three Windows jobs used to pass -DWANT_CLAP=OFF,
# because plugins/ClapEffect/ClapHost.cpp loaded its plugins with dlopen/dlsym and
# neither MinGW nor MSVC ships <dlfcn.h> (the v0.2.1-alpha tag run failed at that very
# include — it was the first Windows build ever to reach the file, CLAP having been
# compiled out of every platform before the provisioning fix). The loader now has a
# Windows half behind `#ifdef _WIN32` (LoadLibraryW/GetProcAddress/FreeLibrary, with the
# wide path so a non-ASCII install directory works), and tests/advertised-features.tsv lists
# clap-hosting for `*`, so the honesty guard enforces WANT_CLAP=ON *and* a clapeffect
# module on Windows exactly as it does on Linux and macOS. The port is CI-verified
# only: the development box has no MinGW or MSVC toolchain.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    # WANT_VST3_TEST_INSTRUMENT=ON is passed by THIS job and by no other.
    #
    # The option (tests/CMakeLists.txt, default OFF) builds the MIT test-instrument
    # FIXTURE and its three ctest targets - Vst3InstrumentFixtureProbe,
    # Vst3InstrumentTest and Vst3InstrumentIntegrationTest - which are the only
    # tests that exercise VST3 INSTRUMENT hosting, the 0.2.1 headline capability,
    # end to end. Until this line existed no job passed it, so that capability had
    # no CI-run test at all: the option defaulted OFF and nothing turned it on (a
    # gap an audit of the release's own claim list found, alongside the three VST3
    # effect-test sources that were registered nowhere). It is passed here, and
    # only here, because this job is the fastest of the seven and already
    # provisions the pinned VST3 SDK that the fixture needs, and one job is enough
    # to prove the suite runs on every push. Elsewhere the default OFF stands, so
    # an ordinary release package gains no test asset.
    #
    # The fixture is installed by nothing and is named "vst3-test-instrument", so
    # it adds no module to a package and matches none of
    # tests/advertised-features.tsv's module globs (the *vst3instrument* one is the
    # product plug-in). There is deliberately NO row for this option in that
    # manifest; its own header explains why (the option is declared inside a
    # conditional in tests/CMakeLists.txt, so it only reaches lmmsversion.h's
    # build-options dump on a build directory that has already been configured
    # once, which would make such a row pass or fail on the build directory's
    # history rather than on the build) - and this job's Release-honesty guard step
    # reads the manifest's rows only, so turning the option on here cannot move it
    # in either direction. Verified, not assumed (0.2.1 coverage-gap report).
    env:
      CMAKE_OPTS: >-
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
        -DWANT_DEBUG_CPACK=ON
        -DWANT_VST3=ON
        -DWANT_CLAP=ON
        -DWANT_VST3_TEST_INSTRUMENT=ON
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
      MAKEFLAGS: -j2
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Clone fltk
        uses: actions/checkout@v4
        with:
          repository: fltk/fltk
          path: fltk
          ref: 27d991f046bdebb12bfd58f7c05a19f135979c29
          fetch-depth: 1
      - name: Configure winehq
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          wget -O - https://dl.winehq.org/wine-builds/winehq.key | \
          sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key -
          sudo wget -NP /etc/apt/sources.list.d/ \
          https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt)
          sudo apt-get install -y --install-recommends g++-multilib gcc-multilib winehq-devel wine-devel-dev
          sudo apt-get install -y --install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-fltk.txt)
      - name: Cache ccache data
        uses: actions/cache@v3
        with:
          key: ccache-${{ github.job }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ github.ref }}-
            ccache-${{ github.job }}-
          path: ~/.ccache
      - name: Configure fltk
        run: |
          cmake -S fltk -B fltk/build -DFLTK_BUILD_SHARED_LIBS=ON -DFLTK_BACKEND_WAYLAND=ON \
            -DFLTK_USE_LIBDECOR_GTK=OFF -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_GL=OFF
      - name: Install fltk
        run: |
          cmake --build fltk/build
          sudo cmake --install fltk/build --prefix /usr
      - name: Cache the pinned VST3 SDK
        uses: actions/cache@v4
        with:
          path: build/vst3sdk
          key: "vst3sdk-${{ runner.os }}-${{ hashFiles('cmake/modules/Vst3Sdk.cmake') }}"
      - name: Cache the pinned CLAP headers
        uses: actions/cache@v4
        with:
          path: build/clap
          key: "clap-${{ runner.os }}-${{ hashFiles('cmake/modules/ClapHeaders.cmake') }}"
      - name: Provision the pinned VST3 SDK and CLAP headers
        # Runs on every job that packages a release. Without it each configure
        # prints "VST3 hosting skipped" and "CLAP hosting skipped" and the release
        # ships neither host. The pins are read out of
        # cmake/modules/{Vst3Sdk,ClapHeaders}.cmake by the script (which carries
        # no copy), and the two cache keys above hash those same files, so bumping
        # a pin in a module invalidates the cache by itself. A full run clones
        # ~39 MB of SDK sources + ~7 MB of CLAP headers once per operating system;
        # later runs restore both from the cache and clone nothing.
        run: bash .github/workflows/provision-plugin-hosting-deps.sh build
      - name: Configure
        run: |
          ccache --zero-stats
          source /opt/qt5*/bin/qt5*-env.sh || true
          cmake -S . \
                -B build \
                $CMAKE_OPTS
      - name: Build
        run: cmake --build build
      - name: Install the control suite's Python dependencies (numpy + scipy)
        # tests/control-mastering-commands.py runs tools/auto-mastering-demo.py as the
        # INDEPENDENT BS.1770-4 measurement its verdicts rest on. That generator exits 2
        # without numpy and scipy - "auto-mastering-demo.py needs numpy and scipy for its
        # independent BS.1770-4 measurement: No module named 'numpy'" - and that one line
        # is the whole of ControlMasteringCommands' failure on all four unix jobs of run
        # 34870198514 (the ONE red test on both linux jobs: 1/140 and 1/149). It is
        # installed here, beside the step that needs it, and not in
        # deps-ubuntu-24.04-gcc.txt: that list is shared with the mingw job, whose ctest
        # never runs this test (the control suite is POSIX-only, tests/CMakeLists.txt),
        # and a shared list would carry the dependency to a job that cannot use it.
        # python3-numpy/python3-scipy land in the system python3 - the interpreter
        # find_program(PYTHON3_EXECUTABLE NAMES python3 ...) resolves at Configure and
        # the one ctest logs as /usr/bin/python3 on both linux jobs.
        run: |
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy
          echo "BS.1770-4 deps this job will run with (interpreter, numpy, scipy):"
          python3 -c "import numpy,scipy,sys;print(sys.executable,numpy.__version__,scipy.__version__)"
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure -j2 || {
            echo "=== ctest failed: re-running only the failed tests, verbosely ==="
            ctest --rerun-failed -V
            exit 1
          }
      - name: Signal-death backtrace (a SIGSEGV must name its frame)
        # QtTest's own handler prints an EMPTY stack on a runner - "Received signal at function
        # time: 0ms ... dumping stack" then "End of stack trace" with nothing between - so the
        # crashing frame is only obtainable by running the binary under a debugger. Bounded: at
        # most three tests, 120 s each; best-effort: it can never fail the job it explains.
        # The bound is `timeout` (GNU coreutils), and the macOS runners do not have it: this step
        # has never produced a backtrace there - run 35126160372, job 104895806458 ends its
        # debugger loop with "line 19: timeout: command not found", which is why that run's two
        # macOS failures (SafeStartTest, Vst3ChunkProbeTest) carry no frame. `gtimeout` is the
        # Homebrew coreutils spelling; with neither, the debugger runs unbounded rather than the
        # evidence being skipped.
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          cd build/tests || exit 0
          log=Testing/Temporary/LastTestsFailed.log
          if command -v gdb >/dev/null 2>&1; then dbg=gdb; else dbg=lldb; fi
          command -v "$dbg" >/dev/null 2>&1 || { echo "no gdb or lldb here: no backtrace"; exit 0; }
          if command -v timeout >/dev/null 2>&1; then tmo=(timeout 120)
          elif command -v gtimeout >/dev/null 2>&1; then tmo=(gtimeout 120)
          else tmo=(); echo "no timeout/gtimeout here: the debugger run below is unbounded"; fi
          [ -f "$log" ] || { echo "no $log: nothing to re-run"; exit 0; }
          # ctest writes "<test-number>:<test-name>", one line per failed test - NOT a reason,
          # so the crash/no-crash split cannot be read out of this file; the debugger reports
          # the signal itself. The python-driven Control* suite is skipped: its harness collects
          # its own liveness/CPU/backtrace evidence and already prints it.
          head -3 "$log" | while read -r entry; do
            name=${entry#*:}
            [ -x "./$name" ] || continue
            case "$name" in Control*) continue ;; esac
            echo "=== $dbg backtrace of failed test $name ==="
            if [ "$dbg" = gdb ]; then
              QT_QPA_PLATFORM=offscreen "${tmo[@]}" gdb -batch -q -ex "set pagination off" \
                -ex run -ex "thread apply all bt" --args "./$name" 2>&1 | tail -120 || true
            else
              QT_QPA_PLATFORM=offscreen "${tmo[@]}" lldb -b -o run \
                -o "thread backtrace all" -o quit -- "./$name" 2>&1 | tail -120 || true
            fi
          done
          echo "=== end of signal backtraces ==="
      - name: Crash evidence (a signal death must name its cause)
        # The C++ QtTest suites do not use the python harness, so an instance that dies of a signal
        # writes its crash report into the runner's XDG data dir rather than a test temp dir - and run
        # 34731085749 showed QtTest printing an EMPTY stack ("dumping stack" then "End of stack trace",
        # nothing between), which names the symptom and not the cause. This collects whatever the
        # product wrote, wherever it wrote it. Harmless when a job has no test step.
        if: failure()
        # Evidence only: it must never fail a job that the test step already failed.
        # (Cycle 8 showed it exiting 1 when no report existed, which is a normal outcome.)
        continue-on-error: true
        shell: bash
        run: |
          echo "=== zene crash reports (a signal death writes one) ==="
          find "$HOME" "${GITHUB_WORKSPACE:-.}" /tmp -maxdepth 6 \
            -name 'zene-crash-report*' 2>/dev/null | head -20 > /tmp/crash-list.txt
          while read -r f; do
            echo "--- $f ---"
            cat "$f"
          done < /tmp/crash-list.txt
          echo "=== end of crash reports ==="
      - name: Release-honesty guard (a documented feature must be in this build)
        # Fails when a feature the release documents as present has been compiled
        # out. The list of documented features has ONE home --
        # tests/advertised-features.tsv -- which this gate reads; the build's own
        # report is the generated header its "Build options:" line is printed
        # from, and the plugin module the option implies is looked up in the build
        # tree. v0.1.0-alpha passed every other step with both hosts skipped.
        run: bash tests/release-honesty-gate.sh --header build/lmmsversion.h --artifacts build
      - name: Release version guard (the version, the documents and the tag must agree)
        # The honesty guard above reads build OPTIONS; it cannot see what the release is CALLED.
        # This one fails when the version this tree declares disagrees with the release notes and
        # the README that name it, or when a tag build's ref is not v<version> — the two ways a
        # release ships a version string no document (or no artefact) agrees with.
        run: bash tests/release-version-gate.sh
      - name: Package
        run: |
          cmake --build build --target package
      - name: Upload artifacts
        # Only a TAG publishes a package. REL-2 (2026-09-15) removed the
        # `|| github.event_name == 'workflow_dispatch'` disjunct that used to be here:
        # a dispatch on any branch staged release packages with no fitness verdict
        # anywhere in the run, so dispatch was a second sanctioned staging path beside
        # the release job. Staging is tag-only now, and a tag is only cut from a ref that
        # .github/workflows/release.yml's fitness job has judged FIT. The shape is
        # asserted on every push by tests/release-staging-path-gate.sh (leg
        # `staging-path` of tests/release-ref-fitness.sh), so it cannot come back
        # silently. Per-push uploads of ~700 MB are still excluded for the original
        # reason: they exhausted the artifact storage quota.
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 14
          path: build/zene-*.AppImage
          # A package-producing job must FAIL if its package glob matches nothing.
          # upload-artifact defaults to `warn`, which lets a release go green having
          # uploaded zero assets for this platform. `error` fails this step with
          # "No files were found with the provided path: <glob>" — the glob and the
          # directory it searched. Verified against the pinned v7 action source.
          if-no-files-found: error
      - name: Trim ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats
        env:
          CCACHE_MAXSIZE: 500M
