---
name: build
# Packages are only uploaded for a tag or a deliberate dispatch (see the upload steps):
# every push used to publish ~700 MB, which exhausted the account's artifact storage and
# made the upload itself fail with a 403. The ctest log stays unconditional - it is tiny
# and it is how a Windows failure becomes readable.
'on':
  push:
  pull_request:
  workflow_dispatch:
# NOTE (2026-09-11): the deps-*.txt files under this directory are consumed with
# `xargs` in the install steps, so they must contain package names only. A comment
# line there is handed to apt as a package name and the step dies with
# 'E: Unable to locate package #' (cost one CI cycle). Put the rationale here, not
# in the list. The same applies to deps-ubuntu-24.04-fltk.txt.
#
# NOTE (plugin hosting, 2026-09-12): every job provisions the pinned VST3 SDK and
# CLAP headers before Configure and passes -DWANT_VST3=ON -DWANT_CLAP=ON, so a
# missing checkout is a configure FAILURE instead of the STATUS-line skip the
# published v0.1.0-alpha shipped to users on all seven jobs ("VST3 hosting
# skipped" / "CLAP hosting skipped") while its release notes advertised both
# hosts. The two cache steps hash the pin-bearing cmake modules, and the
# Release-honesty guard step fails the job if a documented feature is compiled out.
#
# EXCEPTION (2026-09-12): the three Windows jobs pass -DWANT_CLAP=OFF, because the
# CLAP host loads plugins with dlopen/dlsym and neither MinGW nor MSVC has <dlfcn.h>
# (plugins/ClapEffect/ClapHost.cpp:34:10: fatal error: dlfcn.h: No such file or directory
# — the v0.2.1-alpha tag run is the first Windows build ever to reach that file, CLAP
# having been compiled out of every platform before this week's provisioning fix).
# tests/advertised-features.tsv carries the claim per platform (clap-hosting is
# `linux,macos`), and the honesty guard asserts the INVERSE on Windows — WANT_CLAP must
# not be ON and no clapeffect module may exist — so the Windows jobs still check this
# row rather than skipping it. Porting the loader to LoadLibraryW/GetProcAddress is the
# named follow-up; the release notes and known-limitations state the scope.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    env:
      CMAKE_OPTS: >-
        -DUSE_WERROR=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTARGET_UARCH=official
        -DUSE_COMPILE_CACHE=ON
        -DWANT_DEBUG_CPACK=ON
        -DWANT_VST3=ON
        -DWANT_CLAP=ON
      CCACHE_MAXSIZE: 0
      CCACHE_NOCOMPRESS: 1
      MAKEFLAGS: -j2
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Clone fltk
        uses: actions/checkout@v4
        with:
          repository: fltk/fltk
          path: fltk
          ref: 27d991f046bdebb12bfd58f7c05a19f135979c29
          fetch-depth: 1
      - name: Configure winehq
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          wget -O - https://dl.winehq.org/wine-builds/winehq.key | \
          sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key -
          sudo wget -NP /etc/apt/sources.list.d/ \
          https://dl.winehq.org/wine-builds/ubuntu/dists/$(lsb_release -cs)/winehq-$(lsb_release -cs).sources
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-gcc.txt)
          sudo apt-get install -y --install-recommends g++-multilib gcc-multilib winehq-devel wine-devel-dev
          sudo apt-get install -y --install-recommends \
            $(xargs < .github/workflows/deps-ubuntu-24.04-fltk.txt)
      - name: Cache ccache data
        uses: actions/cache@v3
        with:
          key: ccache-${{ github.job }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.job }}-${{ github.ref }}-
            ccache-${{ github.job }}-
          path: ~/.ccache
      - name: Configure fltk
        run: |
          cmake -S fltk -B fltk/build -DFLTK_BUILD_SHARED_LIBS=ON -DFLTK_BACKEND_WAYLAND=ON \
            -DFLTK_USE_LIBDECOR_GTK=OFF -DFLTK_BUILD_TEST=OFF -DFLTK_BUILD_GL=OFF
      - name: Install fltk
        run: |
          cmake --build fltk/build
          sudo cmake --install fltk/build --prefix /usr
      - name: Cache the pinned VST3 SDK
        uses: actions/cache@v4
        with:
          path: build/vst3sdk
          key: "vst3sdk-${{ runner.os }}-${{ hashFiles('cmake/modules/Vst3Sdk.cmake') }}"
      - name: Cache the pinned CLAP headers
        uses: actions/cache@v4
        with:
          path: build/clap
          key: "clap-${{ runner.os }}-${{ hashFiles('cmake/modules/ClapHeaders.cmake') }}"
      - name: Provision the pinned VST3 SDK and CLAP headers
        # Runs on every job that packages a release. Without it each configure
        # prints "VST3 hosting skipped" and "CLAP hosting skipped" and the release
        # ships neither host. The pins are read out of
        # cmake/modules/{Vst3Sdk,ClapHeaders}.cmake by the script (which carries
        # no copy), and the two cache keys above hash those same files, so bumping
        # a pin in a module invalidates the cache by itself. A full run clones
        # ~39 MB of SDK sources + ~7 MB of CLAP headers once per operating system;
        # later runs restore both from the cache and clone nothing.
        run: bash .github/workflows/provision-plugin-hosting-deps.sh build
      - name: Configure
        run: |
          ccache --zero-stats
          source /opt/qt5*/bin/qt5*-env.sh || true
          cmake -S . \
                -B build \
                $CMAKE_OPTS
      - name: Build
        run: cmake --build build
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure -j2 || {
            echo "=== ctest failed: re-running only the failed tests, verbosely ==="
            ctest --rerun-failed -V
            exit 1
          }
      - name: Release-honesty guard (a documented feature must be in this build)
        # Fails when a feature the release documents as present has been compiled
        # out. The list of documented features has ONE home --
        # tests/advertised-features.tsv -- which this gate reads; the build's own
        # report is the generated header its "Build options:" line is printed
        # from, and the plugin module the option implies is looked up in the build
        # tree. v0.1.0-alpha passed every other step with both hosts skipped.
        run: bash tests/release-honesty-gate.sh --header build/lmmsversion.h --artifacts build
      - name: Release version guard (the version, the documents and the tag must agree)
        # The honesty guard above reads build OPTIONS; it cannot see what the release is CALLED.
        # This one fails when the version this tree declares disagrees with the release notes and
        # the README that name it, or when a tag build's ref is not v<version> — the two ways a
        # release ships a version string no document (or no artefact) agrees with.
        run: bash tests/release-version-gate.sh
      - name: Package
        run: |
          cmake --build build --target package
      - name: Upload artifacts
        # Only a tag (the release path) or a deliberate dispatch publishes a package:
        # per-push uploads of ~700 MB exhausted the artifact storage quota.
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 14
          path: build/zene-*.AppImage
          # A package-producing job must FAIL if its package glob matches nothing.
          # upload-artifact defaults to `warn`, which lets a release go green having
          # uploaded zero assets for this platform. `error` fails this step with
          # "No files were found with the provided path: <glob>" — the glob and the
          # directory it searched. Verified against the pinned v7 action source.
          if-no-files-found: error
      - name: Trim ccache and print statistics
        run: |
          ccache --cleanup
          echo "[ccache config]"
          ccache --show-config
          echo "[ccache stats]"
          ccache --show-stats
        env:
          CCACHE_MAXSIZE: 500M
