            echo "Configure; without it this step cannot know where numpy/scipy have to land" >&2
            exit 1
          fi
          echo "provisioning the interpreter the ctest lines name: $py"
          if ! "$py" -m pip install --disable-pip-version-check --no-input numpy scipy; then
