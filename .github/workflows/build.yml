  # REL-2 (2026-09-13): a tag publishes only from a commit whose own matrix is green.
  #
  # The defect this closes. Every build job uploads its package when the ref is a tag
  # (six `if: startsWith(github.ref, 'refs/tags/')` upload steps), and no job `needs:`
  # another, so a tag pushed to a red commit still produced that release's assets. It
  # happened twice in a row: v0.2.0-alpha, and the v0.2.1-alpha re-cut, were both cut
  # from a commit whose own seven-platform matrix was red. This job is the release's
  # gate and it is the workflow half of "a tag is cut from a commit whose own CI run is
  # green" (the program workspace's `NEXT-0.3.0-AGENT-PROMPT.md` §4).
  #
  #   * `needs:` names every build job, so a red matrix is inside this job's graph.
  #     REL-2 (2026-09-15) corrected the ORIGINAL response to that: this job carried no
  #     `if: always()`, so GitHub SKIPPED it whenever any build job failed or was
  #     cancelled. A skipped job records no refusal — `skipped` is not a conclusion a
  #     downstream consumer can read as "this ref was judged and refused" — and the step
  #     below, which exists precisely to refuse a `failure`/`cancelled`/`skipped` entry in
  #     `${{ toJSON(needs) }}`, was therefore unreachable in the only case it was written
  #     for. Measured on the product repo, build run 34870198514 @ f611c888b
  #     (`release/0.3.0`): linux-x86_64, linux-arm64, macos-x86_64, macos-arm64 and
  #     msvc-x64 red (5 of the 7 platforms) and `release gate (green matrix required)` =
  #     `skipped`.
  #
  #     The job now carries `always()`, so a red matrix makes it RUN and exit 1. That is
  #     not a relaxation — `always()` cannot make this job pass, it only changes the
  #     refusal's name from `skipped` to `failure`. Do NOT combine it with
  #     `continue-on-error` and do NOT add an `if:` that reads a job's conclusion.
  #   * REL-2 also removed the tag-only condition. `if: startsWith(github.ref, 'refs/tags/')`
  #     meant the gate spoke only AFTER the tag existed, which cannot keep a tag off a red
  #     commit. It now also runs on a deliberate dispatch; the every-commit, pre-tag half
  #     of the same question lives in .github/workflows/release.yml (on `workflow_run`,
  #     with no conclusion filter, so a red upstream fails that job instead of skipping it).
  #   * tests/release-staging-path-gate.sh asserts this shape (A2 `needs:`, A3 `always()`)
  #     on every push as leg `staging-path` of tests/release-ref-fitness.sh, so the
  #     coverage cannot be narrowed silently either.
  #   * the first step re-asserts that contract against ${{ toJSON(needs) }}, so a
  #     future edit that drops a build job from this list (the matrix has gained and
  #     lost jobs before) fails the job instead of silently narrowing the gate.
  #   * the second step asks the Actions API whether this commit's own push runs of
  #     build.yml, checks.yml and quality-gates.yml are green
  #     (`tests/release-honesty-gate.sh --tag-run`), so a tag on a commit whose main
  #     run was red is refused as well.
  #
  # The publish path is `~/.local/bin/zene-release`, which creates the release object
  # and is run only after this job is green (HANDOFF-0.2.0-RELEASE.md §0.38); this job
  # is what makes that order checkable instead of remembered. It uploads nothing and
  # publishes nothing itself.
  release-gate:
    name: release gate (green matrix required)
    needs:
      - linux-x86_64
      - linux-arm64
      - macos
      - mingw
      - msvc
      - msys2
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every build job succeeded, and every build job is still named here
        run: |
          # The `needs` context as JSON. It is inlined into the script rather than passed
          # through `env:` because the run-script interpolation is the form the docs
          # guarantee for this context; the JSON contains no single quotes, so the
          # single-quoted assignment is literal.
          NEEDS='${{ toJSON(needs) }}'
          echo "$NEEDS"
          rc=0
          for job in linux-x86_64 linux-arm64 macos mingw msvc msys2; do
            case "$NEEDS" in
              *"\"$job\":{"*) : ;;
              *) echo "release gate: build job '$job' is not in needs: — this gate no longer covers it" >&2; rc=1 ;;
            esac
          done
          # A skipped entry would mean a build job never produced a result, so it is
          # refused alongside failure and cancellation rather than read as "not red".
          case "$NEEDS" in
            *'"result":"failure"'*|*'"result":"cancelled"'*|*'"result":"skipped"'*)
              echo "release gate: at least one build job did not succeed — refusing the release" >&2
              rc=1 ;;
          esac
          if [ "$rc" -ne 0 ]; then
            echo "A release is published only from a commit whose own matrix is green." >&2
            exit 1
          fi
          echo "release gate: every build job succeeded and every build job is covered."
      - name: This commit's own push runs must be green
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/release-honesty-gate.sh --tag-run "$GITHUB_SHA"
