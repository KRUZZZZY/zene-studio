        # INDEPENDENT BS.1770-4 measurement its verdicts rest on. That generator exits 2
        # without numpy and scipy - "auto-mastering-demo.py needs numpy and scipy for its
        # independent BS.1770-4 measurement: No module named 'numpy'" - and that one line
        # is the whole of ControlMasteringCommands' failure on all four unix jobs of run
        # 34870198514 (the ONE red test on both linux jobs: 1/140 and 1/149). It is
        # installed here, beside the step that needs it, and not in
        # deps-ubuntu-24.04-gcc.txt: that list is shared with the mingw job, whose ctest
        # never runs this test (the control suite is POSIX-only, tests/CMakeLists.txt),
        # and a shared list would carry the dependency to a job that cannot use it.
