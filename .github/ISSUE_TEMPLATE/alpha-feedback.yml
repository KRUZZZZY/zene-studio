name: Alpha feedback (v0.1.0-alpha)
description: Report a bug, a crash, or something confusing in the v0.1.0-alpha build
title: "[alpha] "
labels: ["alpha-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the alpha. This form asks for the things that make a report actionable;
        without them we usually cannot reproduce the problem.

        **This build writes no log file.** There is nothing to attach from a log path: start the
        app from a terminal and paste what it prints.

        **Check the known-limitations page first:**
        https://github.com/KRUZZZZY/zene-studio/blob/main/docs/KNOWN-LIMITATIONS.md
        if the behaviour is on that page, it is a known gap and does not need an issue.

  - type: input
    id: version
    attributes:
      label: Build
      description: |
        Which file did you download, and what does Help > About (or --version) say? A package from
        the release tag reports 0.1.0-alpha; an earlier CI snapshot reports 1.3.0-alpha.
      placeholder: "e.g. Linux AppImage x86_64, 0.1.0-alpha"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system, version and distribution
      placeholder: "e.g. Ubuntu 24.04, Windows 11 23H2, macOS 15.1"
    validations:
      required: true

  - type: input
    id: audio
    attributes:
      label: Audio backend and device
      description: Settings > Audio. The backend, the device, the buffer size and the sample rate.
      placeholder: "e.g. ALSA, hw:1,0, 512 frames, 48000 Hz"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      value: "1.\n2.\n3."
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behaviour
      description: What you expected to happen, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: console-output
    attributes:
      label: Terminal output and the exact command you ran
      description: |
        This build writes no log file, so the terminal is the only record. Start the app from a
        terminal (the AppImage on Linux, the app from Terminal on macOS, zene.exe from a Command
        Prompt on Windows), paste the exact command and everything the app printed: stdout and
        stderr. If you cannot start it from a terminal, say so and describe what you saw on
        screen instead.
      render: shell
    validations:
      required: true

  - type: textarea
    id: project
    attributes:
      label: Project file (optional)
      description: |
        If the problem is reproducible with a project, attach a minimal one as a .zip. Please do
        not attach anything you would not share publicly, and note that projects are not covered
        by a format stability promise yet, so keep your own backups.
    validations:
      required: false

  - type: input
    id: plugins
    attributes:
      label: Plug-ins and instruments used
      description: Which effects and instruments the project loads. Say so if it uses none.
      placeholder: "e.g. built-in TripleOscillator, a VST3 effect"
    validations:
      required: true

  - type: checkboxes
    id: searched
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this is not a duplicate.
          required: true
