				<dc:description>placeholder - pending the product mark</dc:description>
				<dc:date>2026-09-12</dc:date>
				<dc:rights>Hand-authored placeholder. Contains no third-party artwork and no upstream LMMS artwork; the upstream application-x-lmms-project.svg it replaced remains in git history.</dc:rights>
			</cc:Work>
		</rdf:RDF>
	</metadata>
