<!--
  Zene Studio project-file icon - HAND-AUTHORED PLACEHOLDER (2026-09-12).

  This is NOT the Zene Studio product mark.  It is a plain document sheet with a
  folded corner and a music note on it, drawn from scratch for this file.  It
  replaces the renamed copy of upstream LMMS's application-x-lmms-project.svg,
  which shipped here with the upstream author's own Inkscape export path still
  embedded in its sodipodi:docname/inkscape attributes.  The real mark is the
  owner's decision.

  Hand-authored on purpose: no traced, sampled or vendored artwork, so there is
  no third-party licence to honour and no attribution to carry.  Cubic Bezier
  only.  This file is the source of truth for every raster project-file icon
  under cmake/linux/icons/*/mimetypes/ and for cmake/nsis/project.ico, generated
  by tools/brand/rasterise-placeholders.py - edit here, then re-run that script.

  Drawn at 64x64 and used from 16px up, so the shapes are deliberately bold.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" version="1.1" width="64" height="64" viewBox="0 0 64 64">
