<!--
  Zene Studio application icon - HAND-AUTHORED PLACEHOLDER (2026-09-12).

  This is NOT the Zene Studio product mark.  It is a plain music note on a
  neutral slate plate, drawn from scratch for this file.  It replaces the
  renamed copy of upstream LMMS's lmms.svg, which shipped byte-identical here
  until this change.  The real mark is the owner's decision.

  Hand-authored on purpose: no traced, sampled or vendored artwork, so there is
  no third-party licence to honour and no attribution to carry.  Cubic Bezier
  only.  This file is the source of truth for every raster app icon under
  cmake/linux/icons/*/apps/ and for cmake/nsis/assets/Logo.png, generated by
  tools/brand/rasterise-placeholders.py - edit here, then re-run that script.

  Drawn at 64x64 and used from 16px up, so the shapes are deliberately bold.
-->
