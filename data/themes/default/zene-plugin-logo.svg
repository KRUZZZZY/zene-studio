<!--
  Zene Studio plugin logo - HAND-AUTHORED PLACEHOLDER (2026-09-12).

  This is NOT the Zene Studio product mark.  It is a plain music note punched out
  of a white plate, drawn from scratch for this file, and it exists only so the
  48px plugin-browser and plugin-dialog logo slot stops rendering upstream LMMS
  artwork.  The real mark is the owner's decision and will replace this.

  Hand-authored on purpose: it contains no traced, sampled or vendored artwork,
  so there is no third-party licence to honour and no attribution to carry.
  Geometry is cubic Bezier only (an even-odd punch), which is the subset every
  SVG renderer in this project - QSvgRenderer, via src/gui/embed.cpp - draws.

  Shipped size: 48x48.  Keep the shapes bold if you edit this: the glyph has to
  stay legible at the small end the plugin browser uses.
-->
